name: Wheel platforms

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  musllinux:
    name: musllinux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install uv
      - name: Build wheel
        run: python make_wheels.py --target ${{ matrix.target }}
      - name: Install and run on musl
        run: |
          docker run --rm -v "$PWD:/work:ro" python:3.13-alpine3.22 sh -ec '
            apk add --no-cache git
            python -m pip install --no-cache-dir uv
            for installer in pip uv; do
              python -m venv "/tmp/$installer-env"
              interpreter="/tmp/$installer-env/bin/python"
              if [ "$installer" = pip ]; then
                "$interpreter" -m pip install --no-index --find-links /work/dist git-omit
              else
                uv pip install --python "$interpreter" --no-index --find-links /work/dist git-omit
              fi
              "$interpreter" /work/tests/smoke_wheel.py "/tmp/$installer-env/bin/git-omit"
            done
          '

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Install build frontend
        run: python -m pip install uv
      - name: Build wheel
        run: python make_wheels.py --target aarch64-windows
      - name: Install and run natively
        shell: pwsh
        run: |
          python -c "import sysconfig; assert sysconfig.get_platform() == 'win-arm64'"
          foreach ($installer in @("pip", "uv")) {
            $venv = Join-Path $env:RUNNER_TEMP "$installer-wheel-test"
            python -m venv $venv
            $interpreter = Join-Path $venv "Scripts/python.exe"
            if ($installer -eq "pip") {
              & $interpreter -m pip install --no-index --find-links dist git-omit
            } else {
              uv pip install --python $interpreter --no-index --find-links dist git-omit
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $interpreter tests/smoke_wheel.py (Join-Path $venv "Scripts/git-omit.exe")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
