name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Cross-compile wheels and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-omit
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Run Zig tests
        run: zig build test

      - name: Cross-compile all wheels
        run: python3 make_wheels.py --sdist --expected-version "${{ github.ref_name }}"

      - name: Smoke-test the Linux x86_64 wheel
        shell: bash
        run: |
          linux_wheel="$(find dist -maxdepth 1 -name '*-manylinux_2_17_x86_64.whl' -print -quit)"
          test -n "$linux_wheel"
          uv venv .release-venv --python 3.12
          uv pip install --python .release-venv/bin/python "$linux_wheel"
          .release-venv/bin/git-omit --version
          .release-venv/bin/python -m git_omit --version

      - name: Publish all distributions
        uses: pypa/gh-action-pypi-publish@release/v1
