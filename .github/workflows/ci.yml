name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Check formatting
        run: zig fmt --check src build.zig
      - name: Run tests
        run: zig build test
      - name: Build release
        run: zig build -Doptimize=ReleaseSmall
