name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          # Disabled: the workspace cache dir setup-zig sets for Zig breaks
          # dependency downloads on fresh runners ("failed to create temporary
          # zip file"). The Zig version is left empty so it is resolved from
          # minimum_zig_version in build.zig.zon automatically.
          use-cache: false
      - name: Check formatting
        run: zig fmt --check src build.zig
      - name: Run tests
        run: zig build test
      - name: Build release
        run: zig build -Doptimize=ReleaseSmall
