[build-system]
requires = [
    "hatchling>=1.27",
    "packaging>=24",
]
build-backend = "hatchling.build"

[project]
name = "git-omit"
version = "0.0.2"
description = "Small Git helpers for files that should only be ignored locally"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Noai-oss", email = "jiuwoxiao@outlook.com" },
]

[project.urls]
Repository = "https://github.com/Noai-oss/git-omit"

[tool.hatch.build.targets.wheel]
packages = ["python/git_omit"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/build.zig",
    "/build.zig.zon",
    "/hatch_build.py",
    "/LICENSE",
    "/make_wheels.py",
    "/pyproject.toml",
    "/python",
    "/README.md",
    "/src",
]
